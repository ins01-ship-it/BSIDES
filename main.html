<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSides</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="world">


    <!-- HOME -->
    <section id="home" class="screen">

        <div id="map-bg">
            <img src="images/maptrans.PNG" alt="Map Background">
        </div>

        <div id="logo">
            <h1>BSides</h1>
            <p>← Routen</p>
            <p>↑ Hear gehts lang</p>
        </div>

    </section>

        <!-- OVERLAY -->
    <section id="overlay" class="screen">

        <img class="cross" id="ctopleft" src="images/cross1.PNG" alt="Kreuz">
        <img class="cross" id="ctopright" src="images/cross3.PNG" alt="Kreuz">
        <img class="cross" id="cbotleft" src="images/cross2.PNG" alt="Kreuz">
        <img class="cross" id="cbutleft" src="images/cross4.PNG" alt="Kreuz">

    </section>
    
        <!-- ROUTEN -->
    <section id="routes" class="screen">
        <h1>Routen</h1>

        <div class="route-card"><a href="route-one/routeone.html">Route 1</a></div>
        <div class="route-card"><h2>Route 2</h2></div>
        <div class="route-card"><h2>Route 3</h2></div>
        <div class="route-card"><h2>Route 4</h2></div>
    </section>


    <!-- NEARBY -->
    <section id="nearby" class="screen">

        <h1>In deiner Nähe</h1>

        <div class="card-container">

            <div class="place-card">
                <h2>Schlossplatz</h2>
                <p>120m entfernt</p>
            </div>

            <div class="place-card">
                <h2>Löwenwall</h2>
                <p>240m entfernt</p>
            </div>

            <div class="place-card">
                <h2>Nexus</h2>
                <p>310m entfernt</p>
            </div>

        </div>

    </section>

</div>

<script>
const routes = document.querySelector("#routes");
const nearby = document.querySelector("#nearby");
const logo = document.querySelector("#logo");
const home = document.querySelector("#home");
const overlay = document.querySelector("#overlay");
let startX = 0;
let startY = 0;
let homeOpen = true;
let routeOpen = false;
let nearbyOpen = false;

function updateOverlay() {
    overlay.style.opacity = homeOpen ? "0" : "1";
}

updateOverlay();

document.addEventListener("touchstart",(e)=>{

    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;

});

document.addEventListener("touchend",(e)=>{

    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;

    let dx = endX - startX;
    let dy = endY - startY;

    // links öffnen

    if(dx < -80 && homeOpen === true){

        routes.style.transition = "0.4s";
        routes.style.left = "0";
        logo.style.transition = "0.4s";
        logo.style.opacity = "0";

        routeOpen = true;
        homeOpen = false;
        updateOverlay();
        
    }

    // rechts schließen

    if(dx > 80 && homeOpen === false && routeOpen === true){

        routes.style.transition = "0.4s";
        routes.style.left = "100vw";
        logo.style.transition = "0.4s";
        logo.style.opacity = "1";

        routeOpen = false;
        homeOpen = true;
        updateOverlay();
        
    }

    // hoch öffnen

    if(dy < -80 && homeOpen === true){

        nearby.style.transition = "0.4s";
        nearby.style.top = "0";
        logo.style.transition = "0.4s";
        logo.style.opacity = "0";

        nearbyOpen = true;
        homeOpen = false;
        updateOverlay();
      
    }

    // runter schließen

    if(dy > 80 && homeOpen === false && nearbyOpen === true){

        nearby.style.transition = "0.4s";
        nearby.style.top = "100vh";
        logo.style.transition = "0.4s";
        logo.style.opacity = "1";

        nearbyOpen = false;
        homeOpen = true;
        updateOverlay();
        
    }

}
);



if(nearby.style.top ==="0"){
    nearbyOpen = true;
    routeOpen = false;
    homeOpen = false;
}
if(routes.style.left === "0"){
    routeOpen = true;
    homeOpen = false; 
    nearbyOpen = false;
}
if (nearbyOpen === false && routeOpen === false){
    homeOpen = true;
}else if (homeOpen === false && routeOpen === false){
    nearbyOpen = true;
}else if (homeOpen === false && nearbyOpen === false){
    routeOpen = true;
}

</script>

</body>
</html>
