<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSides</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="world">


    <!-- HOME -->
    <section id="home" class="screen">

        <div id="map-bg">
            <img src="images/maptrans.PNG" alt="Map Background">
        </div>

        <div id="logo">
            <h1>BSides</h1>
            <p>← Routen</p>
            <p>↑ Hear gehts lang</p>
        </div>

    </section>

        <!-- OVERLAY -->
    <section id="overlay" class="screen">

        <img class="cross" id="ctopleft" src="images/cross1.PNG" alt="Kreuz">
        <img class="cross" id="ctopright" src="images/cross3.PNG" alt="Kreuz">
        <img class="cross" id="cbotleft" src="images/cross2.PNG" alt="Kreuz">
        <img class="cross" id="cbutleft" src="images/cross4.PNG" alt="Kreuz">
        <img class="cross" id="cmidleft" src="images/cross2.PNG" alt="Kreuz">
        <img class="cross" id="cmidright" src="images/cross4.PNG" alt="Kreuz">

    </section>
    
        <!-- ROUTEN -->
    <section id="routes" class="screen">
        <h1>Routen</h1>
<a href="route-one/routeone.html">
        <div class="route-card">Route 1</div>
</a>
<a href="route-two/routetwo.html">
        <div class="route-card">Route 2</div>
</a>
    </section>


    <!-- NEARBY -->
    <section id="nearby" class="screen">

        <h1>In deiner Nähe</h1>

        <div class="card-container" id="place-list"></div>

    </section>

</div>

<script src="app.js"></script>
</body>
</html>
