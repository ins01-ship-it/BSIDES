<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSides</title>

<link rel="stylesheet" href="one.css">
</head>

<body>

    <section class="screen">

        <div id="map-bg">
            <img src="../images/maptrans.PNG" alt="Map Background">
            <img id="route1" src="../images/route1.PNG" alt="Route 1">
        </div>
        <h1 class="screen">1</h1>

        <div id="path-bg">
            <img src="../images/path.jpg" alt="path background">

            <a id="so1" class="standort" href="..."><img src="/images/Bilder-Kachel/Michaelishof.jpg" alt="1. Michaelishof"></a>
            <a id="so2" class="standort" href="..."><img src="/images/Bilder-Kachel/Kirschbaum-Allee.jpg" alt="2. Kirschbaum-Allee"></a>
            <a id="so3" class="standort" href="..."><img src="/images/Bilder-Kachel/Schlossarkaden.JPG" alt="3. Schloss"></a>
            <a id="so4" class="standort" href="..."><img src="/images/Bilder-Kachel/Schlossplatz.jpg" alt="4. Schlossplatz"></a>
            <a id="so5" class="standort" href="..."><img src="/images/Bilder-Kachel/Löwenwall.jpg" alt="5. Löwenwall"></a>
            <a id="so6" class="standort" href="..."><img src="/images/Bilder-Kachel/Atelier.jpg" alt="6. Das Atelier"></a>

            <div id="th1" class="thumbnail"></div>
            <div id="th2" class="thumbnail"></div>
            <div id="th3" class="thumbnail"></div>
            <div id="th4" class="thumbnail"></div>
            <div id="th5" class="thumbnail"></div>
            <div id="th6" class="thumbnail"></div>


        </div>

    </section>

        <section id="overlay" class="screen">

        <img class="cross" id="ctopleft" src="../images/cross1.PNG" alt="Kreuz">
        <img class="cross" id="ctopright" src="../images/cross3.PNG" alt="Kreuz">
        <img class="cross" id="cbotleft" src="../images/cross2.PNG" alt="Kreuz">
        <img class="cross" id="cbutleft" src="../images/cross4.PNG" alt="Kreuz">
        <img class="cross" id="cmidleft" src="../images/cross2.PNG" alt="Kreuz">
        <img class="cross" id="cmidright" src="../images/cross4.PNG" alt="Kreuz">

    </section>

    <script>
        (function () {
            let startX = 0;
            let startY = 0;
            const swipeThreshold = 80;
            const maxVerticalDistance = 45;

            function getPoint(event) {
                return event.touches ? event.touches[0] : event;
            }

            function onSwipeStart(event) {
                const point = getPoint(event);
                startX = point.clientX;
                startY = point.clientY;
            }

            function onSwipeEnd(event) {
                const point = getPoint(event.changedTouches ? { touches: event.changedTouches } : event);
                const deltaX = point.clientX - startX;
                const deltaY = point.clientY - startY;

                if (deltaX > swipeThreshold && Math.abs(deltaY) < maxVerticalDistance) {
                    window.location.href = '../main.html#routes';
                }
            }

            document.addEventListener('touchstart', onSwipeStart, { passive: true });
            document.addEventListener('touchend', onSwipeEnd, { passive: true });
            document.addEventListener('mousedown', onSwipeStart);
            document.addEventListener('mouseup', onSwipeEnd);
        })();
    </script>

</body>
</html>
